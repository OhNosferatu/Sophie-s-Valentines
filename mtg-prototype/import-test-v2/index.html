<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MTG Import Test v2</title><style>body{margin:0;background:#171310;color:#f4eadb;font-family:ui-monospace,monospace;padding:16px}.box{max-width:760px;margin:auto;background:#211b17;border:1px solid #66513e;border-radius:14px;padding:14px}textarea{width:100%;min-height:330px;background:#151210;color:#f4eadb;border:1px solid #594838;border-radius:9px;padding:10px;font:inherit;box-sizing:border-box}button{margin-top:10px;min-height:42px;border:1px solid #66513e;border-radius:9px;background:#d3ad70;color:#241b14;font:inherit;font-weight:700;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.card{background:#181411;border:1px solid #40342a;border-radius:9px;padding:10px}.num{font-size:24px;font-weight:800}.label{font-size:10px;color:#b9aa98}.list{font-size:11px;line-height:1.45;white-space:pre-wrap;max-height:180px;overflow:auto;margin-top:6px}.msg{margin-top:10px;font-size:11px;color:#b9aa98}.ok{color:#acd8ac}.err{color:#e3aaa3}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="box"><h2>Deck Import Parser Test v2</h2><p>Paste the exact deck list you sent. This version detects a single trailing card after a Sideboard block as the commander.</p><textarea id="input"></textarea><button id="parse">Parse Deck</button><div id="msg" class="msg">Expected for your Megatron list: 99 deck, 12 sideboard, 1 commander, 0 tokens.</div><div class="grid"><div class="card"><div class="num" id="c1">0</div><div class="label">COMMANDER</div><div class="list" id="l1"></div></div><div class="card"><div class="num" id="c2">0</div><div class="label">DECK</div><div class="list" id="l2"></div></div><div class="card"><div class="num" id="c3">0</div><div class="label">SIDEBOARD</div><div class="list" id="l3"></div></div><div class="card"><div class="num" id="c4">0</div><div class="label">TOKENS</div><div class="list" id="l4"></div></div></div></div><script>function qty(line){const m=line.trim().match(/^(\d+)\s*[xX]?\s+(.+)$/);return m?{q:+m[1],n:m[2].trim()}:null}function heading(raw){let h=raw.toLowerCase().trim().replace(/^#+\s*/,'').replace(/:$/,'').trim().replace(/\s*[\(\[]\s*\d+\s*[\)\]]\s*$/,'').trim().replace(/\s+\d+\s*$/,'').trim();if(/^commander\b/.test(h)||/^command zone\b/.test(h))return'commander';if(/^side\s*board\b/.test(h)||/^maybeboard\b/.test(h))return'sideboard';if(/^tokens?\b/.test(h)||/\btokens?\s*&\s*extras?\b/.test(h))return'tokens';if(/^main\s*board\b/.test(h)||/^main\s*deck\b/.test(h)||/^(deck|library|maindeck)$/.test(h))return'deck';return null}function clean(n){return n.replace(/\s+\*+CMDR\*+\s*/ig,' ').replace(/\s+\[(?:commander|cmdr)\]\s*/ig,' ').replace(/\s+\{(?:commander|cmdr)\}\s*/ig,' ').replace(/\s{2,}/g,' ').trim()}function parse(text){const r={commander:[],deck:[],sideboard:[],tokens:[]};let section='deck',blankAfterSide=false,trailing=[];for(const line of text.replace(/\r/g,'').split('\n')){const raw=line.trim();if(!raw){if(section==='sideboard')blankAfterSide=true;continue}const h=heading(raw);if(h&&!/^\d+\s*[xX]?\s+/.test(raw)){section=h;blankAfterSide=false;trailing=[];continue}const item=qty(raw);if(!item)continue;item.n=clean(item.n);const isCmd=/\*+CMDR\*+|\[(?:commander|cmdr)\]|\{(?:commander|cmdr)\}/i.test(raw);if(isCmd){for(let i=0;i<item.q;i++)r.commander.push(item.n);continue}if(section==='sideboard'&&blankAfterSide){trailing.push(item);continue}for(let i=0;i<item.q;i++)r[section].push(item.n)}if(!r.commander.length&&trailing.length===1&&trailing[0].q===1){r.commander.push(trailing[0].n)}else{for(const item of trailing)for(let i=0;i<item.q;i++)r.sideboard.push(item.n)}return r}document.getElementById('parse').onclick=()=>{try{const r=parse(document.getElementById('input').value);const keys=['commander','deck','sideboard','tokens'];keys.forEach((k,i)=>{document.getElementById('c'+(i+1)).textContent=r[k].length;document.getElementById('l'+(i+1)).textContent=r[k].join('\n')});const ok=r.commander.length===1&&r.deck.length===99&&r.sideboard.length===12&&r.tokens.length===0;const m=document.getElementById('msg');m.className='msg '+(ok?'ok':'');m.textContent=ok?'Perfect — this list classified correctly. Commander: '+r.commander[0]:'Parsed. Check the four counts above.'}catch(e){const m=document.getElementById('msg');m.className='msg err';m.textContent=e.message||'Parse failed'}};</script></body></html>
