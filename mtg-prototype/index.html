<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>MTG Table Prototype</title><style>:root{--bg:#171310;--panel:#27201a;--line:#554535;--felt:#485a49;--text:#f4eadb;--muted:#b9aa98;--gold:#d3ad70}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}.bar{display:flex;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;position:relative;z-index:20}.bar button{min-height:42px;border:1px solid var(--line);border-radius:9px;background:#312820;color:var(--text);padding:0 9px;font:inherit;font-size:11px;font-weight:700}.bar button.active{background:var(--gold);color:#201912}.tabs{display:flex;gap:4px;flex:1}.board{position:relative;height:calc(100vh - 70px);min-height:600px;overflow:hidden;border-radius:16px;border:1px solid #493b30;background:linear-gradient(#536650,#35473b);box-shadow:inset 0 0 0 5px #2a211b,inset 0 0 0 8px #75563c}.screen{display:none;position:absolute;inset:0}.screen.active{display:block}.tablezone{position:absolute;left:5%;right:5%;top:9%;bottom:8%;border:1px dashed #ffffff2d;border-radius:18px}.full .oppHalf{position:absolute;left:5%;right:5%;top:7%;height:39%;border:1px dashed #ffffff2d;border-radius:18px}.full .youHalf{position:absolute;left:5%;right:5%;bottom:7%;height:39%;border:1px dashed #ffffff2d;border-radius:18px}.divider{position:absolute;left:5%;right:5%;top:50%;border-top:2px solid #ffffff35}.title{position:absolute;left:12px;top:11px;background:#181411aa;padding:5px 7px;border-radius:7px;font-size:10px;z-index:5}.life{position:absolute;z-index:6;background:#1b1714df;border:1px solid #665240;border-radius:99px;padding:7px 10px;font-weight:800}.life.you{left:12px;bottom:12px}.life.opp{right:12px;top:12px}.heart{color:#dc6356}.stack{position:absolute;width:72px;height:102px;border-radius:9px;border:2px solid #241d18;background:linear-gradient(145deg,#182331,#0f141c);box-shadow:7px 7px 0 #0e1015,9px 9px 0 #3f342a,inset 0 0 0 2px #a77b37;z-index:6;overflow:visible}.stack.commander{background:linear-gradient(145deg,#302341,#1b1325);box-shadow:7px 7px 0 #130f18,9px 9px 0 #3f342a,inset 0 0 0 2px #745995}.stack.sideboard{background:linear-gradient(145deg,#4a4032,#211c17)}.stack.tokens{background:linear-gradient(145deg,#2a4038,#17231f)}.stack img{width:100%;height:100%;object-fit:cover;border-radius:7px}.stack .label{position:absolute;left:3px;right:3px;bottom:3px;background:#15110fdb;border-radius:5px;padding:3px;font-size:8px;text-align:center}.stack .count{position:absolute;right:-7px;top:-7px;background:#1a1511;border:1px solid var(--gold);border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:9px}.card{position:absolute;width:100px;aspect-ratio:.716;border-radius:8px;overflow:hidden;background:#111;border:1px solid #171411;box-shadow:0 8px 18px #0007;touch-action:none;user-select:none}.card img{width:100%;height:100%;object-fit:cover;pointer-events:none}.card.tapped{transform:rotate(90deg)}.card.mini{width:49px}.fallback{position:absolute;inset:0;background:linear-gradient(145deg,#39452e,#131912);display:flex;flex-direction:column}.fallback b{background:#d9cfb7;color:#1c1815;padding:5px;font-size:8px}.fallback i{flex:1;display:grid;place-items:center;font-size:28px}.hand{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:40;background:#1b1714f2;border:1px solid var(--line);border-radius:14px;padding:9px;box-shadow:0 -16px 40px #0008;transform:translateY(calc(100% + 20px));transition:.2s}.hand.open{transform:translateY(0)}.handHead{display:flex;justify-content:space-between;align-items:center}.handRow{display:flex;gap:8px;overflow-x:auto;padding:7px 3px 9px}.handCard{position:relative;flex:0 0 138px;aspect-ratio:.716;border-radius:9px;overflow:hidden;background:#111;border:1px solid #2a211b;touch-action:none}.handCard img{width:100%;height:100%;object-fit:cover}.modal,.inspect{position:fixed;inset:0;z-index:60;background:#000c;display:none;align-items:center;justify-content:center;padding:14px}.modal.open,.inspect.open{display:flex}.box{width:min(95vw,560px);max-height:90vh;overflow:auto;background:#211b17;border:1px solid #66513e;border-radius:15px;padding:14px}.box h2{margin:0 0 5px;font-size:16px}.box p{font-size:10px;color:var(--muted);line-height:1.45}.method{display:flex;gap:5px;margin:8px 0}.method button{flex:1;min-height:38px;border:1px solid #594838;border-radius:8px;background:#30271f;color:var(--text);font:inherit;font-size:10px;font-weight:700}.method button.active{background:var(--gold);color:#241b14}.pane{display:none}.pane.active{display:block}textarea,input{width:100%;background:#151210;border:1px solid #594838;border-radius:9px;color:var(--text);font:inherit;font-size:12px;padding:11px}textarea{min-height:210px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:9px}.actions button,.closeBtn{min-height:38px;border:1px solid var(--line);border-radius:9px;background:#312820;color:var(--text);padding:0 10px;font:inherit;font-size:10px;font-weight:700}.msg{margin-top:8px;padding:7px;border:1px solid #40342a;border-radius:8px;background:#181411;font-size:10px;color:var(--muted)}.preview{width:min(88vw,390px);max-height:82vh}.preview img{width:100%;border-radius:12px}.toast{position:fixed;left:50%;bottom:88px;z-index:80;transform:translateX(-50%);background:#181411e8;border:1px solid #63503e;border-radius:8px;padding:7px 10px;font-size:10px;opacity:0;transition:.18s}.toast.show{opacity:1}@media(max-width:700px){.board{height:calc(100vh - 67px)}.card{width:94px}.card.mini{width:46px}.stack{width:64px;height:91px}}</style></head><body><div class="bar"><div class="tabs"><button data-view="you" class="active">Your Side</button><button data-view="full">Full Board</button><button data-view="opp">Opponent</button></div><button id="handBtn">Hand</button><button id="importBtn">Import</button></div><main class="board" id="board"><section id="you" class="screen active"><div class="title">YOUR SIDE · FREE MOVEMENT</div><div class="tablezone"></div><div class="life you"><span class="heart">♥</span> 40</div><div id="commander" class="stack commander" style="left:2%;top:17%"></div><div id="sideboard" class="stack sideboard" style="left:2%;top:43%"></div><div id="tokens" class="stack tokens" style="right:2%;top:17%"></div><div id="deck" class="stack" style="right:2%;bottom:14%"></div><div id="yourCards"></div></section><section id="full" class="screen full"><div class="title">FULL BOARD · OVERVIEW</div><div class="oppHalf"></div><div class="youHalf"></div><div class="divider"></div><div class="life opp"><span class="heart">♥</span> 37</div><div class="life you"><span class="heart">♥</span> 40</div><div id="fullCards"></div></section><section id="opp" class="screen"><div class="title">OPPONENT · INSPECT ONLY</div><div class="tablezone"></div><div class="life opp"><span class="heart">♥</span> 37</div><div id="oppCards"></div></section></main><aside class="hand" id="hand"><div class="handHead"><div><b>Your Hand</b><div style="font-size:9px;color:var(--muted)">Drag onto your battlefield to play.</div></div><button class="closeBtn" id="closeHand">Close</button></div><div class="handRow" id="handRow"></div></aside><div class="modal" id="importModal"><div class="box"><h2>Import Deck</h2><p>Import as tabletop stacks. Nothing is auto-sorted onto the battlefield.</p><div class="method"><button id="listMethod" class="active">Paste Card List</button><button id="urlMethod">Deck URL</button></div><div id="listPane" class="pane active"><textarea id="deckList" placeholder="Commander\n1 Queen Marchesa\n\nDeck\n1 Sol Ring\n1 Arcane Signet\n...\n\nSideboard\n1 Example Card\n\nTokens\n2 Treasure Token"></textarea></div><div id="urlPane" class="pane"><input id="deckUrl" type="url" placeholder="https://www.moxfield.com/decks/... or https://archidekt.com/decks/..."></div><div id="msg" class="msg">Paste a list or choose Deck URL.</div><div class="actions"><button id="cancelImport">Cancel</button><button id="runImport">Import Deck</button></div></div></div><div class="inspect" id="inspect"><div class="preview"><img id="previewImg"><div style="text-align:center"><button class="closeBtn" id="closeInspect">Close</button></div></div></div><div class="toast" id="toast"></div><script>(()=>{const $=s=>document.querySelector(s),state={cards:{},battlefield:[],opponent:[],hand:[],commander:[],sideboard:[],tokens:[],deck:[],view:'you'},pos=[[31,27],[49,27],[67,27],[40,60],[58,60]];function mk(id,name,owner,i,zone){state.cards[id]={id,name,owner,index:i,zone,x:pos[i%5][0],y:pos[i%5][1],img:'',tapped:false};return id}['Shivan Dragon','Birds of Paradise','Counterspell','Cultivate'].forEach((n,i)=>state.opponent.push(mk('o'+i,n,'opp',i,'board')));function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1300)}function fallback(n){return `<div class="fallback"><b>${n}</b><i>✦</i></div>`}function inspect(c){if(!c.img){toast(c.name+' image loading');return}$('#previewImg').src=c.img;$('#inspect').classList.add('open')}function cardNode(c,mini=false,movable=false){const d=document.createElement('div');d.className='card'+(mini?' mini':'')+(c.tapped?' tapped':'');d.style.left=c.x+'%';d.style.top=c.y+'%';d.style.zIndex=3+c.index;d.innerHTML=c.img?`<img src="${c.img}" alt="${c.name}">`:fallback(c.name);let drag=null,moved=false,last=0;d.onpointerdown=e=>{moved=false;if(movable){d.setPointerCapture?.(e.pointerId);const p=d.parentElement.getBoundingClientRect(),r=d.getBoundingClientRect();drag={dx:e.clientX-r.left,dy:e.clientY-r.top,p}}};d.onpointermove=e=>{if(!drag)return;moved=true;const nx=Math.max(0,Math.min(drag.p.width-d.offsetWidth,e.clie .push(id);c.zone='board';c.index=state.battlefield.length-1;c.x=Math.max(18,Math.min(80,(e.clientX-b.left)/b.width*100-7));c.y=state.view==='you'?Math.max(16,Math.min(70,(e.clientY-b.top)/b.height*100-9)):58;$('#hand').classList.remove('open');render()}else inspect(c)};h.appendChild(d)});stack($('#commander'),state.commander,'COMMANDER');stack($('#sideboard'),state.sideboard,'SIDEBOARD');stack($('#tokens'),state.tokens,'TOKENS');stack($('#deck'),state.deck,'DECK')}function clean(s){return s.trim().replace(/^\d+\s*[xX]?\s+/,'').replace(/\s+\[[^\]]+\]\s*$/,'').replace(/\s+\([A-Za-z0-9]{2,10}\)\s+\S+\s*$/,'').trim()}function parseList(text){const r={name:'Imported Deck',commander:[],deck:[],sideboard:[],tokens:[]},map={'commander':'commander','commanders':'commander','command zone':'commander','deck':'deck','mainboard':'deck','main deck':'deck','sideboard':'sideboard','maybeboard':'sideboard','tokens':'tokens','token':'tokens'};let section='deck';text.replace(/\r/g,'').split('\n').forEach(line=>{let raw=line.trim();if(!raw)return;let low=raw.toLowerCase().replace(/:$/,'');if(map[low]){section=map[low];return}if(/^#|^\/\//.test(raw))return;let m=raw.match(/^(\d+)\s*[xX]?\s+(.+)$/);if(!m)return;let q=Math.min(100,Math.max(1,parseInt(m[1])||1)),n=clean(m[2]);for(let i=0;i<q;i++)r[section].push(n)});if(!r.deck.length&&!r.commander.length&&!r.sideboard.length&&!r.tokens.length)throw Error('No cards recognized. Use lines like: 1 Sol Ring');return r}async function fetchDeck(url){const u=new URL(url),host=u.hostname.replace(/^www\./,'').toLowerCase();if(host==='archidekt.com'){const m=u.pathname.match(/\/decks\/(\d+)/);if(!m)throw Error('Invalid Archidekt URL');const x=await fetch('https://archidekt.com/api/decks/'+m[1]+'/');if(!x.ok)throw Error('Archidekt blocked the request. Paste the card list instead.');const d=await x.json(),r={name:d.name||'Archidekt Deck',commander:[],deck:[],sideboard:[],tokens:[]};(d.cards||[]).forEach(e=>{let n=e.card?.oracleCard?.name||e.card?.name;if(!n)return;let cats=(e.categories||[]).map(v=>String(typeof v==='string'?v:v?.name||'').toLowerCase()),t=cats.includes('commander')?'commander':cats.includes('sideboard')||cats.includes('maybeboard')?'sideboard':cats.includes('token')||cats.includes('tokens')?'tokens':'deck';for(let i=0;i<(e.quantity||1);i++)r[t].push(n)});return r}if(host==='moxfield.com'){const m=u.pathname.match(/\/decks\/([^/?#]+)/);if(!m)throw Error('Invalid Moxfield URL');for(const ver of ['v3','v2']){try{const x=await fetch('https://api2.moxfield.com/'+ver+'/decks/all/'+m[1]);if(x.ok){const d=await x.json(),r={name:d.name||'Moxfield Deck',commander:[],deck:[],sideboard:[],tokens:[]};const pull=(b,t)=>{if(!b)return;Object.keys(b).forEach(k=>{const e=b[k]||{},n=e.card?.name||k;for(let i=0;i<(e.quantity||1);i++)r[t].push(n)})};pull(d.mainboard,'deck');pull(d.commanders,'commander');pull(d.sideboard,'sideboard');pull(d.tokens,'tokens');return r}}catch{}}throw Error('Moxfield blocked the request. Paste the card list instead.')}throw Error('Use a Moxfield or Archidekt URL')}function applyDeck(d){state.battlefield=[];state.hand=[];state.commander=[];state.sideboard=[];state.tokens=[];state.deck=[];Object.keys(state.cards).forEach(k=>{if(state.cards[k].owner==='you')delete state.cards[k]});const make=(arr,z)=>arr.map((n,i)=>{const id=z+'_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,5);state.cards[id]={id,name:n,owner:'you',index:i,zone:z,x:40,y:40,img:'',tapped:false};return id});state.commander=make(d.commander||[],'commander');state.deck=make(d.deck||[],'deck');state.sideboard=make(d.sideboard||[],'sideboard');state.tokens=make(d.tokens||[],'tokens');render();loadImages();$('#msg').textContent=`Imported ${d.name||'Deck'} · ${state.commander.length} commander · ${state.deck.length} deck · ${state.sideboard.length} sideboard · ${state.tokens.length} tokens`;setTimeout(()=>$('#importModal').classList.remove('open'),650)}async function loadImages(){const ids=[...state.opponent,...state.battlefield,...state.hand,...state.commander.slice(0,2),...state.sideboard.slice(0,1),...state.tokens.slice(0,1),...state.deck.slice(0,1)],names=[...new Set(ids.map(id=>state.cards[id]?.name).filter(Boolean))];for(const name of names){try{const r=await fetch('https://api.scryfall.com/cards/named?exact='+encodeURIComponent(name));if(!r.ok)continue;const d=await r.json(),uri=d.image_uris?.normal||d.card_faces?.[0]?.image_uris?.normal;if(!uri)continue;Object.values(state.cards).forEach(c=>{if(c.name===name)c.img=uri});render()}catch{}}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.view).classList.add('active');state.view=b.dataset.view;if(state.view==='opp')$('#hand').classList.remove('open')});$('#handBtn').onclick=()=>{if(state.view!=='opp')$('#hand').classList.toggle('open')};$('#closeHand').onclick=()=>$('#hand').classList.remove('open');$('#importBtn').onclick=()=>$('#importModal').classList.add('open');$('#cancelImport').onclick=()=>$('#importModal').classList.remove('open');$('#listMethod').onclick=()=>{$('#listMethod').classList.add('active');$('#urlMethod').classList.remove('active');$('#listPane').classList.add('active');$('#urlPane').classList.remove('active')};$('#urlMethod').onclick=()=>{$('#urlMethod').classList.add('active');$('#listMethod').classList.remove('active');$('#urlPane').classList.add('active');$('#listPane').classList.remove('active')};$('#runImport').onclick=async()=>{try{$('#msg').textContent='Importing…';const d=$('#listPane').classList.contains('active')?parseList($('#deckList').value):await fetchDeck($('#deckUrl').value.trim());applyDeck(d)}catch(e){$('#msg').textContent=e.message||'Import failed'}};$('#closeInspect').onclick=()=>$('#inspect').classList.remove('open');$('#inspect').onclick=e=>{if(e.target===$('#inspect'))$('#inspect').classList.remove('open')};let lastDeck=0;$('#deck').addEventListener('click',()=>{const now=Date.now();if(now-lastDeck<350){lastDeck=0;if(!state.deck.length)return toast('Deck empty');const id=state.deck.shift();state.cards[id].zone='hand';state.hand.push(id);render();toast('Drew '+state.cards[id].name)}else lastDeck=now});render();loadImages()})();</script></body></html>
